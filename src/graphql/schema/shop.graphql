# src/graphql/schema/shop.graphql
type Category {
  id: ID!
  name: String!
}

type Receipt {
  id: ID!
  name: String!
  price: Float!
  categoryId: ID!
  category: Category
}

type Query {
  categories: [Category!]!
  receipts: [Receipt!]!
  receipt(id: ID!): Receipt
}

type Mutation {
  createCategory(name: String!): Category!
  createReceipt(name: String!, price: Float!, categoryId: ID!): Receipt!
}